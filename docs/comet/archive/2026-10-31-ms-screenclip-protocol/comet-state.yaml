acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 开关与注册表一致性——首次运行开关默认关闭且 `reg query
      HKCU\\Software\\Classes\\ms-screenclip` 无 Starshot 自建键；打开开关后该键存在且
      `shell\\open\\command` 指向 Starshot 稳定入口 exe；关闭开关后该键被移除，Win+Shift+S
      恢复系统截图工具。"
    result: passed
    reason:
      text: 默认关
        AppConfig.Setting.cs:619-623；Register()（ScreenClipProtocolService.cs:156-201）写经典协议键+Capabilities+RegisteredApplications+SHChangeNotify+打开默认程序页，Unregister()（203-244）全量删除并删
        UserChoice 还原仲裁；211-214 行归属检查不碰他人注册，全程仅
        HKCU；开关失败回弹（ScreenshotSetting.xaml.cs:201-217）；reg query 确认现场已还原
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 协议激活唤起区域截图——接管开启时：(a) Starshot 未运行，通过「运行」执行
      `ms-screenclip:`，Starshot 冷启动并直接进入区域截图覆盖层；(b) Starshot
      托盘常驻（--hide），同一调用唤起区域截图覆盖层且不弹出主窗口。"
    result: passed
    reason:
      text: 冷启动 App.xaml.cs:91-110 设 startHidden 跳过主窗口并
        TryEnqueue(CaptureRegion)；托盘常驻走第二实例命名事件直达（App.xaml.cs:61-67
        Exit(0)）+常驻实例
        StartActivationListener（ScreenClipProtocolService.cs:109-124，静态保活防
        GC）；Builder 探针链 listener-registered→signal-result true→event-fired
        与代码路径逐点对应、进程数恒 1；GUI 实测不可复现，按代码自洽+证据一致性判定
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: Win+Shift+S 接管（硬验收）——接管开启后按 Win+Shift+S 唤起 Starshot 区域截图（Win11
      宿主机实测）；关闭开关后恢复系统截图工具。"
    result: passed
    reason:
      text: 代码为纯注册表协议路由、无任何热键挂钩，与 spec 机制声明（shell 触发 ms-screenclip://?source=HotKey
        经当前用户关联路由）一致；Builder 宿主机 Win11 26200
        硬验收实测（覆盖层出现、SnippingTool/ScreenClipping 进程 0）与代码机制完全对应，关闭还原由删
        UserChoice+SHChangeNotify 支撑
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: 未知参数降级——`ms-screenclip:?unknownFlag=1`
      之类带不支持参数的调用进入区域截图或安全忽略，应用不崩溃、无错误弹窗。"
    result: passed
    reason:
      text: FirstArgumentStartsWithScheme（144-154）仅匹配 scheme
        前缀从不解析参数，未知参数与无参数路由完全相同；全部注册/信号路径有 catch 兜底，不存在可因参数崩溃的代码；Builder
        实测覆盖层正常弹出
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: 注册跨版本稳定——便携版下注册的 command 指向根目录启动器（非
      `app-{version}/Starshot.exe`）；模拟版本目录名变化后注册路径仍有效。"
    result: passed
    reason:
      text: GetStableEntryPath（285-294）与
        GeneralSetting.GetLauncherPath（510-522）逐行同策略；根启动器
        Starshot.Launcher.cpp:65-71 透传 argv 含协议 URI、按 version.ini 动态解析
        app-{version}，版本目录变化后注册路径不变仍有效；与既有自启功能同策略，静态逻辑链闭合（便携布局实测缺口已记录于 risks）
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: 文档与多语言——README zh-CN 与 en 含启用/还原/卸载残留清理说明；设置页新增文案在 zh-CN/en
      资源中齐备。"
    result: passed
    reason:
      text: README.md:426/288 与 README.zh-CN.md:428/290 含启用/还原/卸载残留 reg delete 清理；4
        资源键在 Lang.resx(en)/Lang.zh-CN.resx/Lang.ja-JP.resx
        三语齐备，Designer.cs:2927-2957 四属性生成，ScreenshotSetting.xaml:200-207 绑定完整
      truncated: false
